<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube Audio Mode</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto}
.view{display:none}.view.active{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:#0b0b0b;border-bottom:1px solid #222}
.topbar strong{font-size:20px}.topbar button{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.video-section{min-height:100vh;padding:18px;background:#111}
h1{font-size:26px;margin:8px 0 6px}.sub{color:#aaa;margin:0 0 18px;line-height:1.4}
.video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden}
#player{position:absolute;inset:0;width:100%;height:100%}
.scroll-hint{text-align:center;color:#aaa;margin-top:24px;font-size:15px}
.audio-mode{min-height:100vh;background:#000;padding:calc(24px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.title{font-size:20px;font-weight:650;line-height:1.35;text-align:center;margin-bottom:36px}
.time{font-variant-numeric:tabular-nums;text-align:center;font-size:18px;color:#bbb;margin:16px 0}
input[type=range]{width:100%;margin:10px 0 28px}
.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:center}
button{border:1px solid #333;background:#151515;color:#fff;border-radius:18px;min-height:68px;font-size:18px;font-weight:650}
#playPause{font-size:22px;min-height:82px}
.saved{text-align:center;color:#777;font-size:13px;margin-top:24px;min-height:18px}
.sleep{text-align:center;margin-top:18px}
select{background:#151515;color:#fff;border:1px solid #333;border-radius:14px;padding:12px 16px;font-size:16px;margin:5px}
.back{text-align:center;margin-top:36px}
.back button{min-height:48px;padding:0 18px;font-size:15px}
.library{background:#0b0b0b;padding:24px 18px 40px;min-height:100vh}
.library h2{margin:0 0 8px}.library p{color:#aaa;line-height:1.4}
.add-row{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.add-row input{flex:1;min-width:220px;background:#151515;color:#fff;border:1px solid #333;border-radius:12px;padding:13px;font-size:16px}
.add-row button,.library-item button{min-height:46px;padding:0 14px;font-size:15px;border-radius:12px}
.library-item{border-top:1px solid #222;padding:16px 0}
.library-title{font-weight:650;line-height:1.35;margin-bottom:8px}
.library-meta{color:#888;font-size:13px;margin-bottom:10px}
.library-actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<div id="libraryView" class="view active">
<section class="library" id="library">
<h2>Library</h2>
<p>Paste a YouTube link to save it here.</p>
<div class="add-row">
<input id="youtubeUrl" type="url" inputmode="url" placeholder="Paste YouTube link">
<button id="addVideo">Add</button>
</div>
<div id="libraryMessage" class="saved"></div>
<div id="libraryList"></div>
</section>
</div>

<div id="playerView" class="view">
<div class="topbar"><strong>Player</strong><button id="openLibrary">Library</button></div>
<section class="audio-mode" id="audioMode">
<div class="title">Lesson 2 — Sleep On It: How REM Sleep Supercharges Creativity</div>
<div class="time"><span id="current">0:00</span> / <span id="duration">0:00</span></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position">
<div class="controls">
<button onclick="skip(-30)">−30 sec</button>
<button id="playPause" onclick="togglePlay()">▶︎ Play</button>
<button onclick="skip(30)">+30 sec</button>
</div>
<div class="saved" id="saved"></div>
<div class="sleep">
<select id="speedControl" aria-label="Playback speed">
<option value="0.75">Speed: 0.75×</option>
<option value="1" selected>Speed: 1×</option>
<option value="1.25">Speed: 1.25×</option>
<option value="1.5">Speed: 1.5×</option>
<option value="2">Speed: 2×</option>
</select>
<select id="sleepTimer" aria-label="Sleep timer">
<option value="0">Sleep timer: Off</option>
<option value="10">10 minutes</option>
<option value="20">20 minutes</option>
<option value="30">30 minutes</option>
<option value="60">1 hour</option>
</select>
<div class="saved" id="sleepStatus"></div>
</div>
<div class="back"><button onclick="document.getElementById('videoSection').scrollIntoView({behavior:'smooth'})">Show video</button></div>
</section>

<section class="video-section" id="videoSection">
<h1>YouTube video</h1>
<p class="sub">Scroll here only when you want to see the video.</p>
<div class="video-wrap"><div id="player"></div></div>
<div class="back"><button id="backToControls">Back to audio controls</button></div>
</section>
</div>
</main>

<script>
const VIDEO_ID='UZeokmLo-qQ';
let currentVideoId='UZeokmLo-qQ';
const STORAGE_KEY_PREFIX='yt-audio-position-';
let STORAGE_KEY=STORAGE_KEY_PREFIX+currentVideoId;
const LIBRARY_KEY='yt-audio-library-v1';
let player, ready=false, dragging=false;
let sleepEndsAt=0, sleepInterval=null;

const tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

function onYouTubeIframeAPIReady(){
  player=new YT.Player('player',{
    videoId:currentVideoId,
    playerVars:{playsinline:1,rel:0},
    events:{
      onReady:()=>{
        ready=true;
        const saved=parseFloat(localStorage.getItem(STORAGE_KEY)||'0');
        if(saved>5) player.seekTo(saved,true);
        updateUI();
      },
      onStateChange:updatePlayButton
    }
  });
}

function togglePlay(){
  if(!ready)return;
  const s=player.getPlayerState();
  if(s===YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
}
function skip(seconds){
  if(!ready)return;
  player.seekTo(Math.max(0,Math.min(player.getDuration()||Infinity,player.getCurrentTime()+seconds)),true);
  updateUI();
}
function updatePlayButton(){
  if(!ready)return;
  document.getElementById('playPause').textContent=
    player.getPlayerState()===YT.PlayerState.PLAYING?'❚❚ Pause':'▶︎ Play';
}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : m+':'+String(s).padStart(2,'0');
}
function updateUI(){
  if(!ready)return;
  const cur=player.getCurrentTime()||0,dur=player.getDuration()||0;
  document.getElementById('current').textContent=fmt(cur);
  document.getElementById('duration').textContent=fmt(dur);
  if(!dragging&&dur) document.getElementById('seek').value=Math.round(cur/dur*1000);
  updatePlayButton();
}
const seek=document.getElementById('seek');
seek.addEventListener('input',()=>{dragging=true});
seek.addEventListener('change',()=>{
  if(ready&&player.getDuration()) player.seekTo(seek.value/1000*player.getDuration(),true);
  dragging=false;
});
setInterval(()=>{
  if(!ready)return;
  updateUI();
  const cur=player.getCurrentTime()||0;
  if(cur>0){
    localStorage.setItem(STORAGE_KEY,String(cur));
    document.getElementById('saved').textContent='Position saved automatically';
  }
},1000);
document.getElementById('backToControls').addEventListener('click',()=>document.getElementById('audioMode').scrollIntoView({behavior:'smooth'}));

document.getElementById('speedControl').addEventListener('change',function(){
  if(!ready)return;
  const requested=Number(this.value);
  const available=player.getAvailablePlaybackRates();
  if(available.includes(requested)){
    player.setPlaybackRate(requested);
  } else {
    const closest=available.reduce((a,b)=>Math.abs(b-requested)<Math.abs(a-requested)?b:a,1);
    player.setPlaybackRate(closest);
    this.value=String(closest);
  }
});

document.getElementById('sleepTimer').addEventListener('change',function(){
  const mins=Number(this.value);
  clearInterval(sleepInterval);
  sleepEndsAt=0;
  if(!mins){
    document.getElementById('sleepStatus').textContent='';
    return;
  }
  sleepEndsAt=Date.now()+mins*60000;
  updateSleepTimer();
  sleepInterval=setInterval(updateSleepTimer,1000);
});

function updateSleepTimer(){
  if(!sleepEndsAt)return;
  const remaining=sleepEndsAt-Date.now();
  if(remaining<=0){
    clearInterval(sleepInterval);
    sleepInterval=null;
    sleepEndsAt=0;
    if(ready) player.pauseVideo();
    document.getElementById('sleepStatus').textContent='Sleep timer finished';
    document.getElementById('sleepTimer').value='0';
    return;
  }
  const totalSeconds=Math.ceil(remaining/1000);
  const m=Math.floor(totalSeconds/60);
  const s=totalSeconds%60;
  document.getElementById('sleepStatus').textContent='Pauses in '+m+':'+String(s).padStart(2,'0');
}

function extractVideoId(value){
  try{
    const u=new URL(value.trim());
    if(u.hostname==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
    if(u.hostname.endsWith('youtube.com')){
      if(u.pathname==='/watch') return u.searchParams.get('v');
      const parts=u.pathname.split('/').filter(Boolean);
      if(['shorts','embed','live'].includes(parts[0])) return parts[1]||null;
    }
  }catch(e){}
  return null;
}
function getLibrary(){
  try{return JSON.parse(localStorage.getItem(LIBRARY_KEY)||'[]')}catch(e){return []}
}
function saveLibrary(items){localStorage.setItem(LIBRARY_KEY,JSON.stringify(items))}
function renderLibrary(){
  const box=document.getElementById('libraryList');
  const items=getLibrary();
  box.innerHTML=items.length?'':'<p>No saved videos yet.</p>';
  items.forEach(item=>{
    const row=document.createElement('div'); row.className='library-item';
    const title=document.createElement('div'); title.className='library-title'; title.textContent=item.title||('YouTube video '+item.id);
    const pos=parseFloat(localStorage.getItem(STORAGE_KEY_PREFIX+item.id)||'0');
    const meta=document.createElement('div'); meta.className='library-meta'; meta.textContent=pos>5?'Saved at '+fmt(pos):'Not started';
    const actions=document.createElement('div'); actions.className='library-actions';
    const play=document.createElement('button'); play.textContent='Play'; play.addEventListener('click',()=>loadLibraryVideo(item.id,item.title));
    const remove=document.createElement('button'); remove.textContent='Remove'; remove.addEventListener('click',()=>{saveLibrary(getLibrary().filter(x=>x.id!==item.id));renderLibrary()});
    actions.append(play,remove); row.append(title,meta,actions); box.appendChild(row);
  });
}
function showView(name){
  document.getElementById('libraryView').classList.toggle('active',name==='library');
  document.getElementById('playerView').classList.toggle('active',name==='player');
  window.scrollTo(0,0);
}
document.getElementById('openLibrary').addEventListener('click',()=>{renderLibrary();showView('library')});

function loadLibraryVideo(id,title){
  if(ready){
    const cur=player.getCurrentTime()||0;
    if(cur>0)localStorage.setItem(STORAGE_KEY,String(cur));
    currentVideoId=id; STORAGE_KEY=STORAGE_KEY_PREFIX+id;
    document.querySelector('.title').textContent=title||('YouTube video '+id);
    player.loadVideoById(id);
    const saved=parseFloat(localStorage.getItem(STORAGE_KEY)||'0');
    if(saved>5)setTimeout(()=>player.seekTo(saved,true),500);
    showView('player');
  }
}
async function addVideoToLibrary(){
  const input=document.getElementById('youtubeUrl');
  const id=extractVideoId(input.value);
  const msg=document.getElementById('libraryMessage');
  if(!id){msg.textContent='That does not look like a YouTube video link.';return}
  const items=getLibrary();
  if(!items.some(x=>x.id===id)){
    items.unshift({id,title:'YouTube video '+id});
    saveLibrary(items);
  }
  input.value='';
  msg.textContent='Saved to library';
  renderLibrary();

  try{
    const r=await fetch('https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json');
    if(r.ok){
      const data=await r.json();
      if(data.title){
        const updated=getLibrary();
        const item=updated.find(x=>x.id===id);
        if(item){item.title=data.title;saveLibrary(updated);renderLibrary()}
      }
    }
  }catch(e){}
}
document.getElementById('addVideo').addEventListener('click',addVideoToLibrary);
document.getElementById('youtubeUrl').addEventListener('keydown',e=>{if(e.key==='Enter')addVideoToLibrary()});
renderLibrary();

document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&ready){
    const cur=player.getCurrentTime()||0;
    if(cur>0)localStorage.setItem(STORAGE_KEY,String(cur));
  }
});
</script>
</body>
</html>
